  <main>
    <h1>Console SPARQL</h1>
    <p class="subtitle">Exécuter une requête de lecture directement sur le serveur. Les préfixes <code>sg:</code>, <code>rdf:</code>, <code>rdfs:</code>, <code>owl:</code> et <code>xsd:</code> sont ajoutés automatiquement.</p>

    <section class="card">
      <div class="toolbar" style="margin-bottom:10px">
        <label class="field">Exemples<select id="exemples"></select></label>
      </div>
      <textarea id="requete" rows="9" style="width:100%;font-family:monospace"></textarea>
      <p><button id="executer">Exécuter</button></p>
      <div id="resultat"></div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/console.js"></script>
