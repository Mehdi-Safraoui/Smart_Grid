# Serveur SPARQL Apache Jena Fuseki
#   docker compose up -d          puis   python scripts/load_fuseki.py
#   Interface Fuseki : http://localhost:3030   (admin / admin)
services:
  fuseki:
    image: stain/jena-fuseki
    container_name: smartgrid-fuseki
    ports:
      - "3030:3030"
    environment:
      ADMIN_PASSWORD: admin
      FUSEKI_DATASET_1: smartgrid
    volumes:
      - ./fuseki-data:/fuseki
